# Use root/example as user/password credentials

services:

  app:
    container_name: osadec
    build: ./app
    restart: always
    depends_on:
      - db
    ports:
      # host:container — the app listens on 5000 inside the container.
      # Host 5000 is often already taken (other dev servers), so publish on 5001.
      - "5001:5000"
    volumes:
      - ./app/bucket:/osadec/bucket
      - ./app/tmp:/osadec/tmp
      - ./app/models:/osadec/models

  db:
    # Pinned: the committed data directory in ./db/osadecdb was created by MySQL 8.0
    # and will not start cleanly under mysql:latest (9.x).
    image: mysql:8.0
    restart: always
    container_name: osadecdb
    command: --secure-file-priv=/var/lib/mysql-files
    environment:
      # Root password
      MYSQL_ROOT_PASSWORD: 'godofdb29'
      # User name
      MYSQL_USER: 'admin'
      # User password
      MYSQL_PASSWORD: 'admin'
    ports:
      # <Port exposed>:<MySQL port running inside container>
      - '3307:3306'
    volumes:
      # Where data will be persisted
      - ./db/osadecdb:/var/lib/mysql
      - ./db/db_files/init_db.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/db_files/load_data.sql:/docker-entrypoint-initdb.d/2_load_data.sql
      - ./db/db_files/migrations/0001_detection_review.sql:/docker-entrypoint-initdb.d/3_migration_0001_detection_review.sql
      - ./db/db_files/init_data/:/var/lib/mysql-files/
