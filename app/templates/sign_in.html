{% extends 'base.html' %}

{% block title %}OSADEC | Sign in{% endblock %}

{% block links %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sign_in.css') }}">
{% endblock %}

{% block content %}
<div class="auth-shell">
    {% include 'partials/auth_brand.html' %}

    <div class="auth-form">
        <div class="auth-form__panel">
            <h1>Sign in</h1>
            <p class="auth-form__lead">Welcome back. Enter your credentials to continue.</p>

            <form action="{{ url_for('account') }}" method="post" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <div class="auth-form__row">
                    <span></span>
                    <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                <input name="state" type="hidden" value="sign_in">
            </form>

            <div class="auth-form__divider">New to OSADEC</div>

            <a class="btn btn-secondary btn-block" href="{{ url_for('sign_up') }}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
